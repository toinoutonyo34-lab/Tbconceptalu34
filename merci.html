<!doctype html>
<html lang="fr">
<head>

  <title>Demande envoyée | TB Concep'T Alu</title>

      <h1 style="font-size:clamp(2rem,6vw,4rem);line-height:1.05;color:#031b3c;margin:12px 0 16px">Merci pour votre demande.</h1>

      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px">
        <a class="btn btn-primary" href="/">Retour à l'accueil</a>
        <a class="btn" style="border-color:#d9dee7;color:#073f8c" href="tel:+33698113875">Appeler le 06 98 11 38 75</a>
